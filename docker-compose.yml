version: '3.8'

services:
  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./:/usr/share/nginx/html
    depends_on:
      - backend

  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://user:password@db:5432/travel_db
      - REDIS_URL=redis://redis:6379/0
      # Browser origins allowed by CORS (comma-separated). Set to your real domain in prod.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost}
      # Per-IP rate limits (requests/minute)
      - CHAT_RATE_LIMIT_PER_MINUTE=${CHAT_RATE_LIMIT_PER_MINUTE:-20}
      - BOOKING_RATE_LIMIT_PER_MINUTE=${BOOKING_RATE_LIMIT_PER_MINUTE:-10}
      - API_KEY=dev-secret-key-12345
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      # Booking-lead email (Gmail SMTP). Set SMTP_USER/SMTP_APP_PASSWORD in your .env.
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_APP_PASSWORD=${SMTP_APP_PASSWORD:-}
      - LEAD_NOTIFICATION_EMAIL=${LEAD_NOTIFICATION_EMAIL:-juanventure@gmail.com}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend/app:/app/app

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=travel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d travel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
